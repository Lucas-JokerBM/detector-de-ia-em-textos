[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-ia"
version = "1.0.0"
description = "Avalia documentos .docx quanto à probabilidade de texto gerado por I.A. e sugere alterações."
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7.1"]
license = { file = "LICENSE" }

[project.optional-dependencies]
api     = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
desktop = ["pywebview>=5.0"]
dev     = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
build   = ["nuitka>=2.0"]

[project.scripts]
detector-ia         = "detector_ia.cli:main"
detector-ia-server  = "detector_ia.api.server:main"
detector-ia-desktop = "detector_ia.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detector_ia = ["web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
